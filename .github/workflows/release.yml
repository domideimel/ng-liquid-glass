name: Release

# Bumps the version from Conventional Commits, writes CHANGELOG.md, tags, creates a GitHub
# release and publishes @domideimel/ng-liquid-glass to GitHub Packages, and to npmjs.com with
# provenance once the repository variable NPM_PUBLISH is 'true' (see CONTRIBUTING.md, "Releasing").
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the release without changing anything
        type: boolean
        default: true
      version:
        description: Version or bump (e.g. 0.1.0, minor). Empty = derived from Conventional Commits
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write # npm provenance and trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Deploy key with write access: the only actor allowed to bypass the main ruleset,
          # so `nx release` can push the changelog commit and tag.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@domideimel'
      - run: pnpm install --frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pnpm nx release $VERSION --yes ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # setup-node's .npmrc routes @domideimel to GitHub Packages, so npmjs.com gets its own config.
      # Auth: npm trusted publishing (OIDC) when configured on npmjs.com, otherwise the NPM_TOKEN secret.
      - name: Publish to npmjs.com with provenance
        if: ${{ !inputs.dry-run && vars.NPM_PUBLISH == 'true' }}
        working-directory: dist/packages/ng-liquid-glass
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npmrc="$RUNNER_TEMP/npmjs.npmrc"
          echo "@domideimel:registry=https://registry.npmjs.org/" > "$npmrc"
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$npmrc"; fi
          export NPM_CONFIG_USERCONFIG="$npmrc"
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$name@$version is already on npmjs.com."
            exit 0
          fi
          npm pkg delete publishConfig
          # Node 24's bundled npm 11 supports trusted publishing; no download at release time.
          npm publish --provenance --access public --registry https://registry.npmjs.org/
