name: Sync develop

# After anything lands on main (a develop → main merge, a release commit, a hotfix), fast-forward develop to it.
# Pushes with the release deploy key, the only actor allowed past the branch rulesets. Fails instead of
# rewriting history if develop has commits main doesn't; then open a PR from main into develop.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Fast-forward develop to main
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:refs/heads/develop
          else
            echo "::error::develop has commits that main doesn't; merge main into develop with a PR."
            exit 1
          fi
