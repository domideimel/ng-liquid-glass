name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs for /${{ github.event.repository.name }}/
        run: pnpm nx build docs
        env:
          DOCS_BASE_HREF: /${{ github.event.repository.name }}/
      - name: SPA fallback for GitHub Pages
        run: cp dist/apps/docs/browser/index.html dist/apps/docs/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apps/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
