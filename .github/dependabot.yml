version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
      nx:
        patterns: ['nx', '@nx/*']
      ng-doc:
        patterns: ['@ng-doc/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'playwright', '@playwright/test', 'axe-core', '@axe-core/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', '@typescript-eslint/*', 'jsonc-eslint-parser', 'prettier']
      build-tooling:
        patterns: ['vite', '@swc/*', '@swc-node/*', 'jiti', 'tsx', 'ng-packagr', 'autoprefixer']
    ignore:
      # Pinned until Nx stops importing @angular-devkit/architect/node/index.js (README, "Known constraints").
      - dependency-name: '@angular-devkit/architect'
      # Angular 22.3 supports TypeScript >=6.0 <6.1; move with Angular.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Types must match the Node major we run on (engines + CI: Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
