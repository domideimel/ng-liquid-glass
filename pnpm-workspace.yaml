# Settings only: this is a single-package Nx workspace (projects are resolved via tsconfig paths).
overrides:
  # Nx 24.0 cannot load @angular-devkit/architect >= 0.2203 (new "exports" map). Remove once Nx supports it.
  '@angular-devkit/architect': 0.2202.8
  # Security fixes for transitive dev dependencies whose parents (Nx, NgDoc, mermaid) haven't updated yet.
  # Remove once nx, @ng-doc/builder and mermaid depend on patched versions themselves.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1 # GHSA: ReDoS via globparts amplification
  'katex@>=0.11.0 <0.18.2': ^0.18.2 # GHSA: prototype pollution bypassing trust restrictions
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.8'
  - '@angular-devkit/core@22.2.8'
  - '@ng-doc/app@22.2.1'
  - '@ng-doc/builder@22.2.1'
  - '@ng-doc/core@22.2.1'
  - '@ng-doc/ui-kit@22.2.1'
  - '@ng-doc/utils@22.2.1'
  - '@testing-library/jest-dom@8.0.0'
  - '@testing-library/user-event@14.6.13'
